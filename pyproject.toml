[project]
name = "provenance-harvester"
version = "0.1.0"
description = "Standalone batch harvester for per-version contributor provenance data. Companion to exodos-backend Phase 2."
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "packageurl-python>=0.17.6",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Ruff rule exclusions for vendored Phase 1b code.
# These match exodos-backend's lint posture for the source files,
# so vendored copies stay byte-identical to source.
[tool.ruff.lint.per-file-ignores]
"harvester/extractor/*" = [
    "RUF002",  # Ambiguous unicode in docstrings (× and – are intentional)
    "RUF003",  # Ambiguous unicode in comments (same)
    "UP042",   # StrEnum vs (str, Enum) — preserve source style
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harvester"]
